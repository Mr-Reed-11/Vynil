services:
  api:
    build: .
    image: music-server:latest
    container_name: music-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      STORAGE_DIR: /data
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-1}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_API_KEY: ${APP_API_KEY:-}
      # Auth multi-usuario (JWT). Default: usam o APP_API_KEY se vazios.
      JWT_SECRET: ${JWT_SECRET:-}
      INVITE_KEY: ${INVITE_KEY:-}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-2592000}
      # Aprovacao de cadastro por email (SMTP). Sem isso, cadastro usa convite.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-100}
      # Atualizacao in-app (APK sideloaded)
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-1.0.0}
      APP_LATEST_BUILD: ${APP_LATEST_BUILD:-1}
      APP_APK_FILE: ${APP_APK_FILE:-/data/releases/vynil.apk}
      APP_APK_URL: ${APP_APK_URL:-}
      APP_RELEASE_NOTES: ${APP_RELEASE_NOTES:-}
      APP_UPDATE_MANDATORY: ${APP_UPDATE_MANDATORY:-false}
      # Caminho DENTRO do container, ex.: /data/cookies.txt
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    volumes:
      # Bind mount: os arquivos ficam visiveis em ./storage no host.
      - ./storage:/data
      # Alternativa com volume gerenciado pelo Docker:
      # - music_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

